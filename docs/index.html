<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NATAVE</title>
<style>
  :root {
    --bg: #f7f9fc;
    --card: #ffffff;
    --text: #1c2733;
    --muted: #5b6b7c;
    --accent: #009ffb;
    --border: #e3e8ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1620;
      --card: #161f2b;
      --text: #eaf0f6;
      --muted: #9fb0c0;
      --accent: #4fc3ff;
      --border: #263242;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 420px;
  }
  .brand-mark {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--accent); margin: 0 auto 20px;
  }
  h1 { margin: 0 0 8px; font-size: 1.5rem; }
  p { color: var(--muted); margin-bottom: 28px; }
  nav { display: flex; flex-direction: column; gap: 10px; }
  a {
    display: block;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark"></div>
    <h1>NATAVE</h1>
    <p>Gestión de finanzas personales</p>
    <nav>
      <a href="./privacy-policy.html">Política de Privacidad</a>
      <a href="./support.html">Soporte</a>
    </nav>
  </div>
</body>
</html>
