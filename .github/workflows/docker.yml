name: Docker Build & Push

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push staging
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CONFIG_FILE=config.staging.json
          tags: |
            ghcr.io/eunonti4815162342/cash_organizer_flutter:staging
            ghcr.io/eunonti4815162342/cash_organizer_flutter:staging-${{ github.run_number }}

  build-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push prod
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CONFIG_FILE=config.prod.json
          tags: |
            ghcr.io/eunonti4815162342/cash_organizer_flutter:latest
            ghcr.io/eunonti4815162342/cash_organizer_flutter:${{ github.run_number }}
